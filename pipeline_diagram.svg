<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2430">ADS GY Equity — Data Pipeline</text>
  <text x="600" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Raw extract → cleaning &amp; validation → reconciliation → BI dashboard</text>

  <!-- Stage boxes -->
  <!-- 1 Raw extract -->
  <g>
    <rect x="30" y="120" width="190" height="130" rx="10" fill="#fdf1f1" stroke="#e08a8a" stroke-width="1.5"/>
    <text x="125" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#8a3b3b">Raw Extract</text>
    <text x="125" y="170" text-anchor="middle" font-size="11" fill="#6b7280">Bloomberg-style</text>
    <text x="125" y="186" text-anchor="middle" font-size="11" fill="#6b7280">equity workbook</text>
    <text x="125" y="206" text-anchor="middle" font-size="10.5" fill="#8a3b3b">messy headers,</text>
    <text x="125" y="222" text-anchor="middle" font-size="10.5" fill="#8a3b3b">text-formatted numbers</text>
    <text x="125" y="238" text-anchor="middle" font-size="10.5" fill="#8a3b3b">unit inconsistencies</text>
  </g>

  <!-- 2 Python cleaning -->
  <g>
    <rect x="270" y="110" width="200" height="150" rx="10" fill="#fff8e8" stroke="#e0b24d" stroke-width="1.5"/>
    <text x="370" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#8a6a1f">Python Cleaning</text>
    <text x="370" y="158" text-anchor="middle" font-size="10.5" fill="#6b7280">build_rev_by_segment.py</text>
    <text x="370" y="174" text-anchor="middle" font-size="10.5" fill="#6b7280">clean_extract.py</text>
    <text x="370" y="196" text-anchor="middle" font-size="10.5" fill="#8a6a1f">strip commas/%/parens</text>
    <text x="370" y="212" text-anchor="middle" font-size="10.5" fill="#8a6a1f">fix header rows</text>
    <text x="370" y="228" text-anchor="middle" font-size="10.5" fill="#8a6a1f">tag subtotals, dedupe,</text>
    <text x="370" y="244" text-anchor="middle" font-size="10.5" fill="#8a6a1f">correct units</text>
  </g>

  <!-- 3 Clean data + quality log -->
  <g>
    <rect x="530" y="110" width="210" height="150" rx="10" fill="#eef6ee" stroke="#79b17d" stroke-width="1.5"/>
    <text x="635" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#3c6b40">Clean Datasets</text>
    <text x="635" y="158" text-anchor="middle" font-size="10.5" fill="#6b7280">ads_gy_clean_long.csv</text>
    <text x="635" y="174" text-anchor="middle" font-size="10.5" fill="#6b7280">RevBySegment.csv</text>
    <text x="635" y="196" text-anchor="middle" font-size="10.5" fill="#3c6b40">long-format, tidy</text>
    <text x="635" y="212" text-anchor="middle" font-size="10.5" fill="#3c6b40">+ data_quality_log.csv</text>
    <text x="635" y="228" text-anchor="middle" font-size="10.5" fill="#3c6b40">documents every fix</text>
    <text x="635" y="244" text-anchor="middle" font-size="10.5" fill="#3c6b40">made along the way</text>
  </g>

  <!-- 4 Reconciliation -->
  <g>
    <rect x="800" y="110" width="200" height="150" rx="10" fill="#eef2fb" stroke="#7c93d6" stroke-width="1.5"/>
    <text x="900" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#324a8a">Reconciliation</text>
    <text x="900" y="158" text-anchor="middle" font-size="10.5" fill="#6b7280">reconciliation_report.txt</text>
    <text x="900" y="180" text-anchor="middle" font-size="10.5" fill="#324a8a">Revenue by channel = Total</text>
    <text x="900" y="196" text-anchor="middle" font-size="10.5" fill="#324a8a">Gross Profit = Rev − COGS</text>
    <text x="900" y="212" text-anchor="middle" font-size="10.5" fill="#324a8a">EBIT ties to build-up</text>
    <text x="900" y="228" text-anchor="middle" font-size="10.5" fill="#324a8a">EPS = NI / Wtd. Avg Shares</text>
    <text x="900" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#2f8f52">64 / 64 checks PASS</text>
  </g>

  <!-- 5 Dashboard -->
  <g>
    <rect x="1040" y="120" width="140" height="130" rx="10" fill="#f3eefb" stroke="#a583d6" stroke-width="1.5"/>
    <text x="1110" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#5b3a8a">Power BI</text>
    <text x="1110" y="170" text-anchor="middle" font-size="10.5" fill="#6b7280">new_projecct.pbix</text>
    <text x="1110" y="192" text-anchor="middle" font-size="10.5" fill="#5b3a8a">KPI cards, margin</text>
    <text x="1110" y="208" text-anchor="middle" font-size="10.5" fill="#5b3a8a">trends, waterfall,</text>
    <text x="1110" y="224" text-anchor="middle" font-size="10.5" fill="#5b3a8a">EPS/DPS, insights</text>
  </g>

  <!-- Arrows -->
  <line x1="220" y1="185" x2="266" y2="185" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="470" y1="185" x2="526" y2="185" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="740" y1="185" x2="796" y2="185" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1000" y1="185" x2="1036" y2="185" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Footer note -->
  <text x="600" y="300" text-anchor="middle" font-size="11" fill="#8a8f98">Every step from raw extract to dashboard is versioned, auditable, and tied back to source figures.</text>

  <!-- Bottom legend strip -->
  <g>
    <rect x="60" y="330" width="1080" height="1" fill="#e5e7eb"/>
    <circle cx="90" cy="365" r="5" fill="#e08a8a"/>
    <text x="105" y="369" font-size="11" fill="#4b5563">Raw / unvalidated</text>
    <circle cx="290" cy="365" r="5" fill="#e0b24d"/>
    <text x="305" y="369" font-size="11" fill="#4b5563">Transformation logic</text>
    <circle cx="510" cy="365" r="5" fill="#79b17d"/>
    <text x="525" y="369" font-size="11" fill="#4b5563">Cleaned &amp; documented</text>
    <circle cx="740" cy="365" r="5" fill="#7c93d6"/>
    <text x="755" y="369" font-size="11" fill="#4b5563">Validated against source</text>
    <circle cx="990" cy="365" r="5" fill="#a583d6"/>
    <text x="1005" y="369" font-size="11" fill="#4b5563">Delivered insight</text>
  </g>
</svg>
